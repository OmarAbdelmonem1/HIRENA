services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: hirena-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-hirena}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-hirena}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
