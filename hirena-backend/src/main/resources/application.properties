spring.config.import=optional:file:.env[.properties]
spring.application.name=hirena-backend

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hirena}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration (256-bit secret key & 24 hours expiration in ms by default)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Google Gemini configuration.
# Set GEMINI_API_KEY in the environment; never commit the actual key here.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
gemini.connect-timeout=${GEMINI_CONNECT_TIMEOUT:5s}
gemini.read-timeout=${GEMINI_READ_TIMEOUT:45s}
gemini.max-cv-size-bytes=${GEMINI_MAX_CV_SIZE_BYTES:5242880}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

logging.level.root=ERROR
logging.level.com.hirena=INFO